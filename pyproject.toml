[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tssm-fcabp-experiment"
version = "1.1.0"
description = "Forced-Choice Asymmetric Betting Paradigm and Thermodynamic State-Space Model"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "pyyaml==6.0.1",
    "pyserial==3.5",
]

[project.scripts]
tssm-fcabp = "src.run_fcabp:main"
tssm-simulate = "src.simulate_recovery:main"
